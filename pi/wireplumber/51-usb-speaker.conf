# Creative Pebble V3 USB speakers only offer a "pro-audio" profile, and
# WirePlumber leaves it off by default, so no sink appears. Turn it on so
# the speakers are usable straight after plugging in or rebooting.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Creative_Technology_Ltd_Pebble.*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
]
